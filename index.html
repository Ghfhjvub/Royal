"الحلويات":["تشيز كيك التوت","براونيز الشوكولاتة","مولتن كيك","تيراميسو إيطالي","كريم بروليه","بان كيك بالعسل","وافل بالفواكه","آيس كريم فانيليا","آيس كريم شوكولاتة","كيكة الجزر","سان سباستيان","مهلبية بالفستق","أم علي","تارت الليمون","دونات محشية"],
"الأطباق الرئيسية":["ستيك اللحم الملكي","سلمون مشوي","دجاج مشوي بالأعشاب","دجاج كوردون بلو","فيليه سمك مقلي","ريزوتو الفطر","لحم بصوص الفلفل","دجاج ترياكي","لازانيا اللحم","كفتة بالطحينة","شيش طاووق","فاهيتا اللحم","فاهيتا الدجاج","مندي لحم","مقلوبة الدجاج"],
"البرجر":["برجر بلاك جولد","كلاسيك تشيز برجر","دبل تشيز برجر","برجر مشروم سويس","برجر BBQ","برجر الدجاج المقرمش","برجر الدجاج المشوي","برجر سبايسي","برجر مكسيكي","برجر بيكون بقري","برجر أونيون رينغ","برجر ترافل","برجر نباتي","سلايدر ميني برجر","برجر دبل رويال"],
"الباستا":["باستا ألفريدو","سباغيتي بولونيز","فيتوتشيني ألفريدو","بيني أرابياتا","باستا الدجاج والبيستو","لازانيا الجبن","باستا الروبيان","سباغيتي كاربونارا","رافيولي الجبن","باستا أربعة أجبان","باستا الفطر الكريمية","لينغويني المأكولات البحرية","بيني صوص وردي","تالياتيلي اللحم","باستا الخضروات"],
"المشروبات":["موهيتو كلاسيك","عصير برتقال طازج","ليمون بالنعناع","موهيتو فراولة","موهيتو بلو","عصير مانجو","عصير فراولة","عصير أفوكادو","آيس لاتيه","كابتشينو","قهوة أمريكية","شاي كرك","ميلك شيك شوكولاتة","ميلك شيك فانيليا","مياه معدنية"],
"المشاوي":["مشاوي مشكلة ملكية","ريش ضأن مشوية","كباب لحم","كفتة مشوية","دجاج على الفحم","أوصال لحم","شيش طاووق مشوي","أجنحة BBQ","ضلوع لحم مدخنة","كباب دجاج","سجق مشوي","سمك على الفحم","روبيان مشوي","مشاوي تركية","طبق مشاوي لشخصين"]
};
let seed=[],nextId=1000;
for(const [cat,names] of Object.entries(menuData)) names.forEach((name,i)=>{
 const prices={"البيتزا":11000,"المقبلات":5000,"الحلويات":5500,"الأطباق الرئيسية":16000,"البرجر":10500,"الباستا":12000,"المشروبات":3500,"المشاوي":15000};
 const descriptions={"البيتزا":"عجينة طازجة ومكونات مختارة تُخبز على الطريقة الخاصة بالمطعم.","المقبلات":"اختيار شهي يُحضّر طازجاً ليبدأ تجربتك بأفضل مذاق.","الحلويات":"تحلية مميزة بمكونات غنية ولمسة تقديم راقية.","الأطباق الرئيسية":"طبق متكامل يُحضّر بعناية من أجود المكونات.","البرجر":"لحم أو دجاج طازج مع خبز طري وصوص Royal Table.","الباستا":"باستا إيطالية مطهوة بإتقان مع صلصة غنية.","المشروبات":"مشروب منعش يُحضّر عند الطلب.","المشاوي":"مشويات متبلة ومعدة على الفحم أو الشواية.",};
 seed.push({id:nextId++,name,cat,price:prices[cat]+(i%5)*750,img:`https://loremflickr.com/800/600/${photoTags[cat][i]}?lock=${nextId-1}`,desc:descriptions[cat]});
});
let storedProducts=JSON.parse(localStorage.getItem("rt_products")||"null");
const legacySharedImages=[
"https://images.unsplash.com/photo-1571407970349-bc81e7e96d47?auto=format&fit=crop&w=700&q=80",
"https://images.unsplash.com/photo-1512621776951-a57141f2eefd?auto=format&fit=crop&w=700&q=80",
"https://images.unsplash.com/photo-1533134242443-d4fd215305ad?auto=format&fit=crop&w=700&q=80",
"https://images.unsplash.com/photo-1546241072-48010ad2862c?auto=format&fit=crop&w=700&q=80",
"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=700&q=80",
"https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=700&q=80",
"https://images.unsplash.com/photo-1513558161293-cbait9f8d?auto=format&fit=crop&w=700&q=80",
"https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=700&q=80"
];
let products=storedProducts?([
 ...storedProducts.map(old=>{
   const fresh=seed.find(p=>p.id===old.id);
   return fresh && legacySharedImages.includes(old.img) ? {...old,img:fresh.img} : old;
 }),
 ...seed.filter(p=>!storedProducts.some(old=>old.id===p.id))
]):seed;
localStorage.setItem("rt_products",JSON.stringify(products));
let visibleCount=8;
let orders=JSON.parse(localStorage.getItem("rt_orders")||"[]"),logs=JSON.parse(localStorage.getItem("rt_logs")||"[]"),cart={},role=null,category="الكل",deferredPrompt=null;
const money=n=>Number(n||0).toLocaleString("en-US")+" ج.س";
let trackingUnsub=null;
function applyTheme(theme){document.body.dataset.theme=theme;localStorage.setItem("rt_theme",theme);const b=document.getElementById("themeToggle");if(b){b.innerHTML=theme==="light"?'<i data-lucide="moon"></i>':'<i data-lucide="sun"></i>';b.title=theme==="light"?"تفعيل الوضع الليلي":"تفعيل الوضع النهاري";icons()}}
function toggleTheme(){applyTheme(document.body.dataset.theme==="light"?"dark":"light")}
function toggleTableField(){const dine=document.getElementById("delivery").value==="داخل المطعم";document.getElementById("tableNumberField").classList.toggle("hidden",!dine);if(!dine)document.getElementById("tableNumber").value=""}
function makeTrackingCode(){const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return Array.from(bytes,b=>alphabet[b%alphabet.length]).join("")}
function openTrackModal(code=""){document.getElementById("trackingInput").value=code||localStorage.getItem("rt_last_tracking")||"";document.getElementById("trackingResult").innerHTML="";document.getElementById("trackModal").classList.remove("hidden");if(code)trackOrder()}
function closeTrackModal(){document.getElementById("trackModal").classList.add("hidden");if(trackingUnsub){trackingUnsub();trackingUnsub=null}}
function renderTracking(data,code){const labels=["جديد","قيد التحضير","جاهز","مكتمل"];const current=data.status||"جديد";const cancelled=current==="ملغي";const idx=labels.indexOf(current);document.getElementById("trackingResult").innerHTML=`<div class="panel" style="margin:0"><div class="muted">رمز التتبع</div><b style="font:700 20px DM Sans;letter-spacing:2px;color:var(--gold2)">${esc(code)}</b><div style="margin:18px 0 8px">حالة طلبك الحالية</div><h2 style="color:${cancelled?'var(--red)':'var(--gold2)'}">${esc(current)}</h2>${cancelled?'<p class="muted">تم إلغاء هذا الطلب. يرجى التواصل مع المطعم إذا كنت تحتاج إلى مساعدة.</p>':`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:15px 0">${labels.map((x,i)=>`<div style="height:6px;border-radius:8px;background:${i<=idx?'var(--gold)':'var(--line)'}"></div>`).join("")}</div><div style="display:flex;justify-content:space-between;gap:5px;font-size:9px;color:var(--muted)">${labels.map(x=>`<span>${x}</span>`).join("")}</div>`}<p class="muted" style="margin-top:15px">تتحدث الحالة تلقائياً عند تحديثها من المطعم.</p></div>`}
async function trackOrder(){const code=document.getElementById("trackingInput").value.trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{16}$/.test(code)){document.getElementById("trackingResult").innerHTML='<p style="color:var(--red)">رمز التتبع غير صحيح. تأكد من إدخال الرمز كاملاً.</p>';return}if(trackingUnsub){trackingUnsub();trackingUnsub=null}document.getElementById("trackingResult").innerHTML='<p class="muted">جارٍ البحث عن طلبك...</p>';try{trackingUnsub=fbDb.collection("order_tracking").doc(code).onSnapshot(doc=>{if(!doc.exists){document.getElementById("trackingResult").innerHTML='<p style="color:var(--red)">لم نعثر على طلب بهذا الرمز.</p>';return}renderTracking(doc.data(),code)},err=>{document.getElementById("trackingResult").innerHTML=`<p style="color:var(--red)">تعذر جلب حالة الطلب: ${esc(fbError(err))}</p>`})}catch(e){document.getElementById("trackingResult").innerHTML=`<p style="color:var(--red)">${esc(fbError(e))}</p>`}}

function persist(){localStorage.setItem("rt_products",JSON.stringify(products));localStorage.setItem("rt_orders",JSON.stringify(orders));localStorage.setItem("rt_logs",JSON.stringify(logs))}
function log(action,detail){logs.unshift({time:new Date().toLocaleString("ar"),by:role||"زائر",action,detail});persist()}
function toast(s){let t=document.createElement("div");t.className="toast";t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}
function renderMenu(){let cats=["الكل",...new Set(products.map(p=>p.cat))];document.getElementById("categories").innerHTML=cats.map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';visibleCount=8;renderMenu()">${c}</button>`).join("");let list=products.filter(p=>category==="الكل"||p.cat===category);let shown=category==="الكل"?list.slice(0,visibleCount):list;document.getElementById("products").innerHTML=shown.map(p=>`<article class="foodcard"><div class="foodimg"><img src="${p.img}" onerror="this.style.opacity='0.18';this.alt='تعذر تحميل الصورة'"><span class="tag">${p.cat}</span></div><div class="foodbody"><h3>${esc(p.name)}</h3><p>${esc(p.desc||"طبق مميز من مطبخنا")}</p><div class="foodfoot"><span class="price">${money(p.price)}</span><button class="add" onclick="addCart(${p.id})">+</button></div></div></article>`).join("")||'<p class="muted">لا توجد منتجات في هذا التصنيف حالياً.</p>';let more=document.getElementById("menuMore");if(more){more.innerHTML=(category==="الكل"&&visibleCount<list.length)?`<button class="goldbtn" onclick="visibleCount+=8;renderMenu()">المزيد　↓</button>`:(category==="الكل"&&visibleCount>=list.length?`<span class="muted">عرضت جميع الأطباق (${list.length})</span>`:"");}icons()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function icons(){if(window.lucide)lucide.createIcons()}
function addCart(id){cart[id]=(cart[id]||0)+1;renderCart();toast("تمت إضافة الطبق إلى السلة")}
function toggleCart(){document.getElementById("cart").classList.toggle("open");renderCart()}
function renderCart(){let items=Object.entries(cart).filter(x=>x[1]>0),total=0;document.getElementById("cartItems").innerHTML=items.map(([id,q])=>{let p=products.find(x=>x.id==id);if(!p)return "";total+=p.price*q;return `<div class="cartline"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)}</div></div><div class="qty"><button onclick="changeQty(${id},-1)">−</button>${q}<button onclick="changeQty(${id},1)">+</button></div></div>`}).join("")||'<p class="muted">السلة فارغة حتى الآن.</p>';document.getElementById("cartTotal").textContent=money(total);document.getElementById("cartCount").textContent=items.reduce((a,x)=>a+x[1],0)}
function changeQty(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];renderCart()}
function checkout(){if(!Object.keys(cart).length)return toast("أضف طبقاً إلى السلة أولاً");document.getElementById("checkoutTotal").textContent=document.getElementById("cartTotal").textContent;toggleTableField();document.getElementById("checkoutModal").classList.remove("hidden")}
function openLogin(){document.getElementById("loginModal").classList.remove("hidden");document.getElementById("pin").value=""}
function closeModal(id){document.getElementById(id).classList.add("hidden")}
function login(){let pin=document.getElementById("pin").value;if(pin==="2017")role="مدير";else if(pin==="2015")role="عامل";else{document.getElementById("loginError").textContent="رمز الدخول غير صحيح";return}closeModal("loginModal");document.getElementById("store").classList.add("hidden");document.getElementById("cart").classList.remove("open");document.getElementById("admin").classList.remove("hidden");document.getElementById("roleLabel").textContent=role;log("تسجيل دخول",role);showPage("dashboard",document.querySelector('[data-page="dashboard"]'))}

  const order={name,phone,delivery,...(delivery==="داخل المطعم"?{tableNumber}:{}),items:lines,total,status:"جديد",trackingCode,createdAt:firebase.firestore.FieldValue.serverTimestamp(),time:new Date().toLocaleString("ar")};
  try{
    const batch=fbDb.batch();
    batch.set(fbDb.collection("orders").doc(id),order);
    batch.set(fbDb.collection("order_tracking").doc(trackingCode),{status:"جديد",createdAt:firebase.firestore.FieldValue.serverTimestamp()});

async function setOrderStatus(id,s){

  const o=orders.find(x=>String(x.id)===String(id));
  try{
    const batch=fbDb.batch(),stamp=firebase.firestore.FieldValue.serverTimestamp();

function editProduct(id){
  if(!role)return;
  let p=id==null?null:products.find(x=>String(x.id)===String(id)),manager=role==="مدير";
  if(id!=null&&!p)return toast("لم يتم العثور على الطبق");
  if(!p&&!manager)return toast("العامل لا يمكنه إضافة أطباق جديدة");
  document.getElementById("editTitle").textContent=p?"تعديل بيانات الطبق":"إضافة طبق جديد";
  document.getElementById("editId").value=p?.id||"";
  document.getElementById("editName").value=p?.name||"";
  document.getElementById("editCat").value=p?.cat||"";
  document.getElementById("editPrice").value=p?.price??"";
  document.getElementById("editImage").value=p?.img?.startsWith("data:")?"":(p?.img||"");
  document.getElementById("editDesc").value=p?.desc||"";
  document.getElementById("editImagePreview").src=p?.img||"";
  document.getElementById("editCat").closest(".field").classList.toggle("hidden",!manager);
  document.getElementById("editDescField").classList.toggle("hidden",!manager);
  document.getElementById("imageUrlField").classList.toggle("hidden",!manager);
  document.getElementById("editModal").classList.remove("hidden");
}

async function saveProduct(){
  if(!currentUser||!role)return toast("يجب تسجيل الدخول");
  const id=document.getElementById("editId").value,name=document.getElementById("editName").value.trim(),price=Number(document.getElementById("editPrice").value);
  const manager=role==="مدير",p=products.find(x=>String(x.id)===String(id));
  if(!name||!Number.isFinite(price)||price<0)return toast("أدخل اسم الطبق وسعراً صحيحاً");
  if(!p&&!manager)return toast("لا تملك صلاحية إضافة طبق");
  try{
    let img=p?.img||"";
    if(manager && document.getElementById("editImage").value.trim()) img=document.getElementById("editImage").value.trim();
    if(!img)return toast("أدخل رابط صورة مباشر يبدأ بـ https://"); 
    if(!/^https:\/\//i.test(img))return toast("يجب أن يبدأ رابط الصورة بـ https://");
    const data={name,price,img,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:currentProfile.displayName||currentUser.email};
    if(manager){
      const cat=document.getElementById("editCat").value.trim();
      if(!cat)return toast("أدخل تصنيف الطبق");
      data.cat=cat;data.desc=document.getElementById("editDesc").value.trim();
    }
    if(p) await fbDb.collection("products").doc(String(p.id)).update(data);
    else {
      const newId=String(Date.now());data.cat=document.getElementById("editCat").value.trim();data.desc=document.getElementById("editDesc").value.trim();
      await fbDb.collection("products").doc(newId).set(data);
    }
    await log(p?"تعديل منتج":"إضافة منتج",`${name} · ${money(price)}`);
    closeModal("editModal");toast("تم حفظ الطبق في قاعدة البيانات");
  }catch(e){toast("تعذر حفظ المنتج: "+fbError(e))}
}
async function deleteProduct(id){
  if(role!=="مدير")return toast("هذه الصلاحية للمدير فقط");
  if(!confirm("هل تريد حذف هذا المنتج من قاعدة البيانات؟"))return;
  try{const p=products.find(x=>String(x.id)===String(id));await fbDb.collection("products").doc(String(id)).delete();await log("حذف منتج",p?.name||id);toast("تم حذف المنتج")}
  catch(e){toast("تعذر حذف المنتج: "+fbError(e))}
}
async function importLocalMenuToFirebase(){
  if(role!=="مدير")return toast("استيراد القائمة متاح للمدير فقط");
  if(!confirm(`سيتم رفع ${products.length} طبقاً من القائمة الحالية إلى Firebase. سيتم تجاوز أي طبق له نفس المعرف. متابعة؟`))return;
  try{
    let batch=fbDb.batch(),count=0;
    for(const p of products){
      const ref=fbDb.collection("products").doc(String(p.id));
      batch.set(ref,{name:p.name,cat:p.cat,price:Number(p.price),img:p.img,desc:p.desc||"",importedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      count++;
      if(count%400===0){await batch.commit();batch=fbDb.batch()}
    }
    if(count%400)await batch.commit();
    await log("استيراد قائمة الطعام",`تم استيراد ${count} طبقاً إلى Firestore`);
    toast(`تم استيراد ${count} طبقاً بنجاح`);

}

async function login(){let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;document.getElementById('error').textContent='';if(!email||!password){document.getElementById('error').textContent='أدخل البريد وكلمة المرور';return}try{let cred=await auth.signInWithEmailAndPassword(email,password),snap=await db.collection('users').doc(cred.user.uid).get();if(!snap.exists||!['worker','cashier'].includes(snap.data().role)){await auth.signOut();throw new Error('هذا الحساب ليس لديه صلاحية الكاشير. يجب أن يكون role = worker أو cashier في users/{uid}.')}user=cred.user;profile=snap.data();startApp()}catch(e){document.getElementById('error').textContent=fbError(e)}}
function startApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');unProducts=db.collection('products').onSnapshot(s=>{products=s.docs.map(d=>({...d.data(),id:d.id}));renderProducts()},e=>toast('تعذر تحميل الأصناف: '+fbError(e)));unOrders=db.collection('orders').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{orders=s.docs.map(d=>({...d.data(),id:d.id,time:d.data().createdAt?.toDate?.().toLocaleString('ar')||''}));renderOrders()},e=>toast('تعذر تحميل الطلبات: '+fbError(e)));}
function renderProducts(){let cats=['الكل',...new Set(products.map(p=>p.cat).filter(Boolean))];document.getElementById('cats').innerHTML=cats.map(c=>`<button class="cat ${c===category?'active':''}" onclick="category='${esc(c)}';renderProducts()">${esc(c)}</button>`).join('');let q=document.getElementById('search').value.trim().toLowerCase(),list=products.filter(p=>(category==='الكل'||p.cat===category)&&String(p.name||'').toLowerCase().includes(q));document.getElementById('products').innerHTML=list.map(p=>`<article class="product"><img src="${esc(p.img||'')}" alt="${esc(p.name)}" onerror="this.style.opacity='.15'"><div class="pbody"><b>${esc(p.name)}</b><div class="pfoot"><span class="price">${money(p.price)}</span><button class="add" onclick="add('${esc(p.id)}')">+</button></div></div></article>`).join('')||'<div class="empty">لا توجد أصناف مطابقة</div>'}
function add(id){cart[id]=(cart[id]||0)+1;renderCart()}function change(id,n){cart[id]=(cart[id]||0)+n;if(cart[id]<=0)delete cart[id];renderCart()}
function renderCart(){let rows=Object.entries(cart).map(([id,q])=>{let p=products.find(x=>String(x.id)===String(id));return p?{p,q}:null}).filter(Boolean);document.getElementById('lines').innerHTML=rows.map(({p,q})=>`<div class="line"><div><b>${esc(p.name)}</b><div class="muted">${money(p.price)} × ${q}</div></div><div class="qty"><button onclick="change('${esc(p.id)}',-1)">−</button><b>${q}</b><button onclick="change('${esc(p.id)}',1)">+</button></div></div>`).join('')||'<div class="empty">لم تتم إضافة أصناف بعد</div>';document.getElementById('total').textContent=money(rows.reduce((a,x)=>a+Number(x.p.price)*x.q,0))}
function setPay(b){payment=b.dataset.pay;document.querySelectorAll('.pay button').forEach(x=>x.classList.toggle('active',x===b))}function toggleTable(){document.getElementById('table').classList.toggle('hidden',document.getElementById('delivery').value!=='داخل المطعم')}
async function submitOrder(){if(!user)return toast('سجل الدخول أولاً');let items=Object.entries(cart).map(([id,qty])=>{let p=products.find(x=>String(x.id)===String(id));return p?{id:String(id),name:p.name,price:Number(p.price),qty}:null}).filter(Boolean);if(!items.length)return toast('أضف طبقاً واحداً على الأقل');let delivery=document.getElementById('delivery').value,tableNumber=document.getElementById('table').value.trim();if(delivery==='داخل المطعم'&&!tableNumber)return toast('أدخل رقم الطاولة');let total=items.reduce((s,x)=>s+x.price*x.qty,0),id=String(Date.now());let order={name:document.getElementById('customer').value.trim()||'عميل الكاشير',phone:document.getElementById('phone').value.trim(),delivery,...(delivery==='داخل المطعم'?{tableNumber}:{}),items,total,status:'جديد',source:'pos',paymentMethod:payment,note:document.getElementById('note').value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:user.uid,createdByName:profile.displayName||user.email,time:new Date().toLocaleString('ar')};try{await db.collection('orders').doc(id).set(order);await db.collection('activity_logs').add({uid:user.uid,by:profile.displayName||user.email,role:profile.role||'worker',action:'إنشاء طلب كاشير',detail:`الطلب #${id.slice(-5)} · ${money(total)}`,createdAt:firebase.firestore.FieldValue.serverTimestamp(),time:new Date().toLocaleString('ar')});cart={};renderCart();['customer','phone','table','note'].forEach(x=>document.getElementById(x).value='');toast('تم حفظ الطلب وإرساله لقائمة الطلبات')}catch(e){toast('تعذر حفظ الطلب: '+fbError(e))}}
function renderOrders(){document.getElementById('orders').innerHTML=orders.filter(o=>!['مكتمل','ملغي'].includes(o.status)).map(o=>`<article class="order"><b>طلب #${String(o.id).slice(-5)} · ${esc(o.source==='pos'?'كاشير':'الموقع')}</b><p>${esc(o.name||'')} · ${esc(o.delivery||'')}</p><p>${(o.items||[]).map(x=>esc(x.name)+' × '+x.qty).join('، ')}</p><b>${money(o.total)}</b><select onchange="updateStatus('${esc(o.id)}',this.value)"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التحضير'?'selected':''}>قيد التحضير</option><option ${o.status==='جاهز'?'selected':''}>جاهز</option><option>مكتمل</option><option>ملغي</option></select></article>`).join('')||'<div class="empty">لا توجد طلبات نشطة حالياً</div>'}
async function updateStatus(id,status){try{await db.collection('orders').doc(id).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:profile.displayName||user.email});let o=orders.find(x=>x.id===id);if(o?.trackingCode)await db.collection('order_tracking').doc(o.trackingCode).update({status,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});await db.collection('activity_logs').add({uid:user.uid,by:profile.displayName||user.email,role:profile.role||'worker',action:'تحديث حالة طلب',detail:`الطلب #${id.slice(-5)} أصبح ${status}`,createdAt:firebase.firestore.FieldValue.serverTimestamp()});toast('تم تحديث حالة الطلب')}catch(e){toast('تعذر تحديث الحالة: '+fbError(e))}}
async function logout(){if(unProducts)unProducts();if(unOrders)unOrders();if(auth)await auth.signOut();user=null;profile=null;document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function applyTheme(t){document.body.dataset.theme=t;localStorage.setItem('pos_theme',t);document.getElementById('themeBtn').textContent=t==='light'?'الوضع الداكن':'الوضع الفاتح'}function toggleTheme(){applyTheme(document.body.dataset.theme==='light'?'dark':'light')}
function installApp(){if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.finally(()=>deferredPrompt=null)}else toast('من Chrome اختر ⋮ ثم تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية')};window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});0;applyTheme(localStorage.getItem('pos_theme')||'dark');toggleTable();if(auth)auth.onAuthStateChanged(async u=>{if(!u)return;try{let s=await db.collection('users').doc(u.uid).get();if(s.exists&&['worker','cashier'].includes(s.data().role)){user=u;profile=s.data();startApp()}else await auth.signOut()}catch(e){console.warn(e)}});
<\/script></body></html>
</script>

<script type="text/plain" id="app-manager"><!DOCTYPE html>

<style>
:root{--bg:#11110f;--panel:#1a1a17;--panel2:#22221e;--gold:#c9a96e;--gold2:#ead5a6;--cream:#f4efe5;--muted:#aaa69d;--line:#34332d;--green:#83b99a;--red:#d98278;--radius:18px}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:Alexandria, sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}.hidden{display:none!important}
.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;background:#11110fee;backdrop-filter:blur(18px);z-index:10}
.brand{display:flex;align-items:center;gap:12px}.brandmark{width:40px;height:40px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;border-radius:12px;font-family:DM Sans;font-weight:700}.brandname{font-size:16px;letter-spacing:2px;font-family:DM Sans;font-weight:700}.brandname small{display:block;font:9px Alexandria;color:var(--gold);letter-spacing:3px;margin-top:4px}
.nav{display:flex;gap:26px;color:#c7c1b5;font-size:12px}.nav a:hover{color:var(--gold)}.actions{display:flex;gap:10px;align-items:center}.iconbtn{background:var(--panel2);border:1px solid var(--line);color:var(--cream);width:42px;height:42px;border-radius:13px;display:grid;place-items:center}.goldbtn{background:var(--gold);color:#17150f;padding:13px 19px;border-radius:12px;font-weight:700;font-size:12px}.outline{background:transparent;border:1px solid var(--gold);color:var(--gold);padding:12px 17px;border-radius:12px;font-size:12px}
.hero{padding:70px 7vw 60px;display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center;max-width:1500px;margin:auto}.eyebrow{color:var(--gold);letter-spacing:3px;font-size:11px}.hero h1{font-size:clamp(38px,5vw,68px);line-height:1.45;margin:18px 0;font-weight:700}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);line-height:2.2;font-size:13px;max-width:540px}.heroBtns{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}.heroimg{height:470px;border-radius:30px;overflow:hidden;position:relative;border:1px solid #66553a}.heroimg img{width:100%;height:100%;object-fit:cover;filter:brightness(.78)}.heroimg:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#11110f)}
.stats{display:flex;gap:35px;margin-top:38px}.stat b{font:700 24px DM Sans;color:var(--gold)}.stat small{display:block;color:var(--muted);font-size:10px;margin-top:7px}
.section{max-width:1400px;margin:0 auto;padding:42px 5vw 65px}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin-bottom:25px}.sectionhead h2{font-size:26px;margin:8px 0}.sectionhead p{color:var(--muted);font-size:11px}.chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:25px}.chip{background:var(--panel);border:1px solid var(--line);color:#c9c4b9;padding:10px 17px;border-radius:30px;font-size:11px}.chip.active{background:var(--gold);color:#17150f;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.foodcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.25s}.foodcard:hover{transform:translateY(-5px);border-color:#88734e}.foodimg{height:190px;position:relative;background:#292820}.foodimg img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:12px;right:12px;background:#17150fdc;color:var(--gold2);padding:7px 10px;border-radius:20px;font-size:9px}.foodbody{padding:16px}.foodbody h3{font-size:14px;margin:0 0 8px}.foodbody p{color:var(--muted);font-size:10px;line-height:1.9;min-height:38px}.foodfoot{display:flex;align-items:center;justify-content:space-between;margin-top:14px}.price{color:var(--gold2);font:700 16px DM Sans}.add{width:36px;height:36px;background:var(--gold);color:#17150f;border-radius:11px;font-size:20px}
#menuMore .goldbtn{min-width:150px}.promo{margin:10px 5vw 65px;background:linear-gradient(110deg,#29251d,#171714);border:1px solid #594a32;border-radius:25px;padding:35px 45px;display:flex;justify-content:space-between;align-items:center;gap:20px}.promo h2{font-size:24px}.promo p{color:var(--muted);font-size:11px}
footer{border-top:1px solid var(--line);padding:30px 5vw;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;background:#000a;z-index:30;display:flex;justify-content:center;align-items:center;padding:16px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:25px;width:min(460px,100%);max-height:90vh;overflow:auto}.modal h2{margin-top:0}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:11px;color:var(--muted)}.field input,.field textarea,.field select{background:#11110f;border:1px solid var(--line);border-radius:11px;padding:12px;color:var(--cream);outline:none;width:100%}.field input:focus,.field textarea:focus{border-color:var(--gold)}.modalActions{display:flex;gap:10px;margin-top:20px}.modalActions>*{flex:1}
.cartpanel{position:fixed;z-index:25;top:0;left:0;height:100%;width:min(420px,100%);background:var(--panel);border-right:1px solid var(--line);padding:25px;transform:translateX(-105%);transition:.3s;overflow:auto}.cartpanel.open{transform:translateX(0)}.cartline{display:flex;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid var(--line);font-size:11px}.qty{display:flex;gap:8px;align-items:center}.qty button{background:var(--panel2);color:var(--gold);width:25px;height:25px;border-radius:7px}.totalrow{display:flex;justify-content:space-between;margin:22px 0;font-weight:700}
.admin{min-height:100vh;background:#10100e}.adminbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.adminlayout{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 70px)}.sidebar{border-left:1px solid var(--line);padding:22px 14px}.sideitem{display:flex;align-items:center;gap:12px;padding:13px 15px;color:#b9b4a9;font-size:11px;border-radius:11px;margin-bottom:5px;background:transparent;text-align:right;width:100%}.sideitem.active,.sideitem:hover{background:#2a261e;color:var(--gold2)}.adminmain{padding:28px;min-width:0}.adminhead{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-bottom:25px}.adminhead h1{font-size:23px;margin:0 0 7px}.muted{color:var(--muted);font-size:11px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.kpi span{color:var(--muted);font-size:10px}.kpi b{display:block;font:700 24px DM Sans;color:var(--gold2);margin-top:12px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:19px;margin-bottom:18px;overflow:auto}.panel h3{font-size:14px;margin:0 0 16px}.table{width:100%;border-collapse:collapse;min-width:600px}.table th,.table td{padding:13px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:10px}.table th{color:var(--muted);font-weight:500}.status{padding:6px 9px;border-radius:20px;background:#29352d;color:#a9d6b7;font-size:9px}.smallbtn{padding:8px 11px;border-radius:8px;background:#302c23;color:var(--gold2);font-size:10px;margin:2px}.danger{background:#3a2421;color:#e4a49d}.productrow{display:flex;align-items:center;gap:10px}.productrow img{width:42px;height:42px;border-radius:9px;object-fit:cover}
.toast{position:fixed;bottom:22px;right:50%;transform:translateX(50%);background:#e9d6ae;color:#17150f;padding:12px 20px;border-radius:12px;z-index:80;font-size:11px;box-shadow:0 10px 40px #0008}
.qrbox{background:white;padding:16px;border-radius:12px;width:max-content;margin:15px auto}

  .topbar {

}

<body class="manager-app">
<div id="store">
<header class="topbar">
 <a class="brand" href="#"><div class="brandmark">RT</div><div class="brandname">ROYAL TABLE<small>DINING EXPERIENCE</small></div></a>
 <nav class="nav"><a href="#home">الرئيسية</a><a href="#menu">قائمة الطعام</a><a href="#offers">العروض</a><a href="#contact">تواصل معنا</a></nav>
 <div class="actions"><button class="iconbtn" id="themeToggle" onclick="toggleTheme()" aria-label="تغيير الوضع" title="الوضع الليلي أو النهاري"><i data-lucide="sun"></i></button><button class="iconbtn" onclick="toggleCart()" aria-label="السلة"><i data-lucide="shopping-bag"></i><span id="cartCount" style="font-size:9px"></span></button><button class="outline" onclick="installApp()" title="تثبيت تطبيق المطعم"><i data-lucide="download" style="width:14px;vertical-align:middle"></i> تثبيت</button><button class="goldbtn" onclick="openLogin()">لوحة الإدارة</button></div>
</header>
<section class="hero" id="home">

];

function applyTheme(theme){document.body.dataset.theme=theme;localStorage.setItem("rt_theme",theme);const b=document.getElementById("themeToggle");if(b){b.innerHTML=theme==="light"?'<i data-lucide="moon"></i>':'<i data-lucide="sun"></i>';b.title=theme==="light"?"تفعيل الوضع الليلي":"تفعيل الوضع النهاري";icons()}}

function makeTrackingCode(){const alphabet="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);return Array.from(bytes,b=>alphabet[b%alphabet.length]).join("")}
function openTrackModal(code=""){document.getElementById("trackingInput").value=code||localStorage.getItem("rt_last_tracking")||"";document.getElementById("trackingResult").innerHTML="";document.getElementById("trackModal").classList.remove("hidden");if(code)trackOrder()}
function closeTrackModal(){document.getElementById("trackModal").classList.add("hidden");if(trackingUnsub){trackingUnsub();trackingUnsub=null}}
function renderTracking(data,code){const labels=["جديد","قيد التحضير","جاهز","مكتمل"];const current=data.status||"جديد";const cancelled=current==="ملغي";const idx=labels.indexOf(current);document.getElementById("trackingResult").innerHTML=`<div class="panel" style="margin:0"><div class="muted">رمز التتبع</div><b style="font:700 20px DM Sans;letter-spacing:2px;color:var(--gold2)">${esc(code)}</b><div style="margin:18px 0 8px">حالة طلبك الحالية</div><h2 style="color:${cancelled?'var(--red)':'var(--gold2)'}">${esc(current)}</h2>${cancelled?'<p class="muted">تم إلغاء هذا الطلب. يرجى التواصل مع المطعم إذا كنت تحتاج إلى مساعدة.</p>':`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:15px 0">${labels.map((x,i)=>`<div style="height:6px;border-radius:8px;background:${i<=idx?'var(--gold)':'var(--line)'}"></div>`).join("")}</div><div style="display:flex;justify-content:space-between;gap:5px;font-size:9px;color:var(--muted)">${labels.map(x=>`<span>${x}</span>`).join("")}</div>`}<p class="muted" style="margin-top:15px">تتحدث الحالة تلقائياً عند تحديثها من المطعم.</p></div>`}
async function trackOrder(){const code=document.getElementById("trackingInput").value.trim().toUpperCase();if(!/^[A-HJ-NP-Z2-9]{16}$/.test(code)){document.getElementById("trackingResult").innerHTML='<p style="color:var(--red)">رمز التتبع غير صحيح. تأكد من إدخال الرمز كاملاً.</p>';return}if(trackingUnsub){trackingUnsub();trackingUnsub=null}document.getElementById("trackingResult").innerHTML='<p class="muted">جارٍ البحث عن طلبك...</p>';try{trackingUnsub=fbDb.collection("order_tracking").doc(code).onSnapshot(doc=>{if(!doc.exists){document.getElementById("trackingResult").innerHTML='<p style="color:var(--red)">لم نعثر على طلب بهذا الرمز.</p>';return}renderTracking(doc.data(),code)},err=>{document.getElementById("trackingResult").innerHTML=`<p style="color:var(--red)">تعذر جلب حالة الطلب: ${esc(fbError(err))}</p>`})}catch(e){document.getElementById("trackingResult").innerHTML=`<p style="color:var(--red)">${esc(fbError(e))}</p>`}}

}

function notifyNewOrder(o){
  try{
    const a=new AudioContext(),osc=a.createOscillator(),gain=a.createGain();
    osc.type="sine";osc.frequency.setValueAtTime(880,a.currentTime);
    gain.gain.setValueAtTime(.0001,a.currentTime);gain.gain.exponentialRampToValueAtTime(.22,a.currentTime+.03);gain.gain.exponentialRampToValueAtTime(.0001,a.currentTime+.55);
    osc.connect(gain);gain.connect(a.destination);osc.start();osc.stop(a.currentTime+.58);setTimeout(()=>a.close(),700);
  }catch(e){}
  toast("🔔 طلب جديد من "+o.name+" — "+money(o.total));
  if("Notification" in window && Notification.permission==="granted"){
    try{new Notification("طلب جديد – ROYAL TABLE",{body:`${o.name} · ${money(o.total)}`,tag:"order-"+o.id})}catch(e){}
  }
}
async function requestNotificationPermission(){
  if("Notification" in window && Notification.permission==="default"){
    const p=await Notification.requestPermission();
    toast(p==="granted"?"تم تفعيل إشعارات المتصفح":"لم يتم السماح بالإشعارات");
  }
}
function persist(){
  // Local cache only; Firestore is the source of truth when connected.
  try{
    localStorage.setItem("rt_products",JSON.stringify(products));
    localStorage.setItem("rt_orders",JSON.stringify(orders));
    localStorage.setItem("rt_logs",JSON.stringify(logs));
  }catch(e){console.warn("Local cache full",e)}
}
async function log(action,detail){
  const entry={uid:currentUser?.uid||null,by:currentProfile?.displayName||currentUser?.email||role||"زائر",role:currentProfile?.role||"customer",action,detail:String(detail||""),time:new Date().toLocaleString("ar"),createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  try{
    if(currentUser) await fbDb.collection("activity_logs").add(entry);
    else {logs.unshift(entry);localStorage.setItem("rt_logs",JSON.stringify(logs))}
  }catch(e){console.error("Activity log failed",e)}
}
const APP_MODE="manager";
async function login(){
  const email=document.getElementById("authEmail").value.trim(),password=document.getElementById("authPassword").value;
  const err=document.getElementById("loginError");err.textContent="";
  if(!email||!password){err.textContent="أدخل البريد الإلكتروني وكلمة المرور.";return}
  try{
    const cred=await fbAuth.signInWithEmailAndPassword(email,password);
    currentUser=cred.user;
    const doc=await fbDb.collection("users").doc(currentUser.uid).get();
    if(!doc.exists) throw new Error("لم يتم إعداد ملف صلاحيات هذا الحساب في users. راجع دليل إعداد Firebase المرفق.");
    setRoleFromProfile(doc.data());
    if(role!=="مدير") throw new Error("هذه الواجهة مخصصة لحساب المدير فقط.");
    closeModal("loginModal");document.getElementById("store").classList.add("hidden");
    document.getElementById("cart").classList.remove("open");document.getElementById("admin").classList.remove("hidden");
    document.getElementById("roleLabel").textContent=(currentProfile.displayName||currentUser.email)+" · "+role;
    await log("تسجيل دخول","تم تسجيل الدخول إلى لوحة "+role);
    startFirebaseListeners();requestNotificationPermission();
    showPage("dashboard",document.querySelector('[data-page="dashboard"]'));
  }catch(e){err.textContent=fbError(e);if(currentUser){await fbAuth.signOut();currentUser=null;currentProfile=null;role=null}}
}
async function logout(){
  try{await log("تسجيل خروج","تم تسجيل الخروج");}catch(e){}
  stopFirebaseListeners();if(fbAuth)await fbAuth.signOut().catch(()=>{});
  currentUser=null;currentProfile=null;role=null;
  document.getElementById("admin").classList.add("hidden");document.getElementById("store").classList.remove("hidden");renderMenu();
}
async function placeOrder(){
  const name=document.getElementById("customer").value.trim(),phone=document.getElementById("phone").value.trim();
  const delivery=document.getElementById("delivery").value;
  const tableNumber=document.getElementById("tableNumber").value.trim();
  if(!name||!phone)return toast("يرجى إدخال الاسم ورقم الهاتف");
  if(delivery==="داخل المطعم"&&(!tableNumber||Number(tableNumber)<1))return toast("أدخل رقم الطاولة لتوصيل الطلب إليها");
  if(!firebaseReady)return toast("الاتصال بقاعدة البيانات غير متاح حالياً");
  const lines=Object.entries(cart).map(([id,q])=>{const p=products.find(x=>x.id==id);return p?{id:String(id),name:p.name,price:Number(p.price),qty:q}:null}).filter(Boolean);
  if(!lines.length)return toast("السلة فارغة");
  const total=lines.reduce((sum,x)=>sum+x.price*x.qty,0),id=String(Date.now()),trackingCode=makeTrackingCode();
  const order={name,phone,delivery,...(delivery==="داخل المطعم"?{tableNumber}:{}),items:lines,total,status:"جديد",trackingCode,createdAt:firebase.firestore.FieldValue.serverTimestamp(),time:new Date().toLocaleString("ar")};
  try{
    const batch=fbDb.batch();
    batch.set(fbDb.collection("orders").doc(id),order);
    batch.set(fbDb.collection("order_tracking").doc(trackingCode),{status:"جديد",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    await batch.commit();
    localStorage.setItem("rt_last_tracking",trackingCode);
    cart={};renderCart();closeModal("checkoutModal");document.getElementById("cart").classList.remove("open");
    document.getElementById("tableNumber").value="";document.getElementById("delivery").value="استلام من المطعم";toggleTableField();
    toast("تم إرسال طلبك بنجاح إلى المطعم");
    openTrackModal(trackingCode);
  }catch(e){toast("تعذر إرسال الطلب: "+fbError(e))}
}
async function setOrderStatus(id,s){
  if(!currentUser||!role)return toast("سجّل الدخول أولاً");
  const o=orders.find(x=>String(x.id)===String(id));
  try{
    const batch=fbDb.batch(),stamp=firebase.firestore.FieldValue.serverTimestamp();
    batch.update(fbDb.collection("orders").doc(String(id)),{status:s,updatedAt:stamp,updatedBy:currentProfile.displayName||currentUser.email});
    if(o?.trackingCode)batch.update(fbDb.collection("order_tracking").doc(o.trackingCode),{status:s,updatedAt:stamp});
    await batch.commit();
    await log("تحديث حالة طلب",`الطلب #${String(id).slice(-5)} أصبح ${s}`);
    toast("تم تحديث حالة الطلب");
  }catch(e){toast("تعذر تحديث الطلب: "+fbError(e))}
}

function editProduct(id){
  if(!role)return;
  let p=id==null?null:products.find(x=>String(x.id)===String(id)),manager=role==="مدير";
  if(id!=null&&!p)return toast("لم يتم العثور على الطبق");
  if(!p&&!manager)return toast("العامل لا يمكنه إضافة أطباق جديدة");
  document.getElementById("editTitle").textContent=p?"تعديل بيانات الطبق":"إضافة طبق جديد";
  document.getElementById("editId").value=p?.id||"";
  document.getElementById("editName").value=p?.name||"";
  document.getElementById("editCat").value=p?.cat||"";
  document.getElementById("editPrice").value=p?.price??"";
  document.getElementById("editImage").value=p?.img?.startsWith("data:")?"":(p?.img||"");
  document.getElementById("editDesc").value=p?.desc||"";
  document.getElementById("editImagePreview").src=p?.img||"";
  document.getElementById("editCat").closest(".field").classList.toggle("hidden",!manager);
  document.getElementById("editDescField").classList.toggle("hidden",!manager);
  document.getElementById("imageUrlField").classList.toggle("hidden",!manager);
  document.getElementById("editModal").classList.remove("hidden");
}

async function saveProduct(){
  if(!currentUser||!role)return toast("يجب تسجيل الدخول");
  const id=document.getElementById("editId").value,name=document.getElementById("editName").value.trim(),price=Number(document.getElementById("editPrice").value);
  const manager=role==="مدير",p=products.find(x=>String(x.id)===String(id));
  if(!name||!Number.isFinite(price)||price<0)return toast("أدخل اسم الطبق وسعراً صحيحاً");
  if(!p&&!manager)return toast("لا تملك صلاحية إضافة طبق");
  try{
    let img=p?.img||"";
    if(manager && document.getElementById("editImage").value.trim()) img=document.getElementById("editImage").value.trim();
    if(!img)return toast("أدخل رابط صورة مباشر يبدأ بـ https://"); 
    if(!/^https:\/\//i.test(img))return toast("يجب أن يبدأ رابط الصورة بـ https://");
    const data={name,price,img,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:currentProfile.displayName||currentUser.email};
    if(manager){
      const cat=document.getElementById("editCat").value.trim();
      if(!cat)return toast("أدخل تصنيف الطبق");
      data.cat=cat;data.desc=document.getElementById("editDesc").value.trim();
    }
    if(p) await fbDb.collection("products").doc(String(p.id)).update(data);
    else {
      const newId=String(Date.now());data.cat=document.getElementById("editCat").value.trim();data.desc=document.getElementById("editDesc").value.trim();
      await fbDb.collection("products").doc(newId).set(data);
    }
    await log(p?"تعديل منتج":"إضافة منتج",`${name} · ${money(price)}`);
    closeModal("editModal");toast("تم حفظ الطبق في قاعدة البيانات");
  }catch(e){toast("تعذر حفظ المنتج: "+fbError(e))}
}
async function deleteProduct(id){
  if(role!=="مدير")return toast("هذه الصلاحية للمدير فقط");
  if(!confirm("هل تريد حذف هذا المنتج من قاعدة البيانات؟"))return;
  try{const p=products.find(x=>String(x.id)===String(id));await fbDb.collection("products").doc(String(id)).delete();await log("حذف منتج",p?.name||id);toast("تم حذف المنتج")}
  catch(e){toast("تعذر حذف المنتج: "+fbError(e))}
}
async function importLocalMenuToFirebase(){
  if(role!=="مدير")return toast("استيراد القائمة متاح للمدير فقط");
  if(!confirm(`سيتم رفع ${products.length} طبقاً من القائمة الحالية إلى Firebase. سيتم تجاوز أي طبق له نفس المعرف. متابعة؟`))return;
  try{
    let batch=fbDb.batch(),count=0;
    for(const p of products){
      const ref=fbDb.collection("products").doc(String(p.id));
      batch.set(ref,{name:p.name,cat:p.cat,price:Number(p.price),img:p.img,desc:p.desc||"",importedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      count++;
      if(count%400===0){await batch.commit();batch=fbDb.batch()}
    }
    if(count%400)await batch.commit();
    await log("استيراد قائمة الطعام",`تم استيراد ${count} طبقاً إلى Firestore`);
    toast(`تم استيراد ${count} طبقاً بنجاح`);
  }catch(e){toast("فشل الاستيراد: "+fbError(e))}
}

  let manager=role==="مدير";
  return `<div class="adminhead"><div><h1>إدارة قائمة الطعام</h1><div class="muted">${manager?"إدارة القائمة المركزية وصورها وأسعارها.":"اضغط على أي طبق لتعديل اسمه وسعره وصورته."}</div></div>${manager?'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="outline" onclick="importLocalMenuToFirebase()">استيراد القائمة الحالية</button><button class="goldbtn" onclick="editProduct()">＋ إضافة طبق</button></div>':""}</div><div class="panel"><table class="table"><thead><tr><th>المنتج</th><th>التصنيف</th><th>السعر</th><th>الإجراءات</th></tr></thead><tbody>${products.map(p=>`<tr onclick="editProduct('${p.id}')" style="cursor:pointer"><td><div class="productrow"><img src="${esc(p.img)}" onerror="this.style.opacity='.2'"><b>${esc(p.name)}</b></div></td><td>${esc(p.cat)}</td><td>${money(p.price)}</td><td><button class="smallbtn" onclick="event.stopPropagation();editProduct('${p.id}')">تعديل الطبق</button>${manager?`<button class="smallbtn danger" onclick="event.stopPropagation();deleteProduct('${p.id}')">حذف</button>`:""}</td></tr>`).join("")||'<tr><td colspan="4">لا توجد منتجات في Firestore. استورد القائمة الحالية من زر المدير.</td></tr>'}</tbody></table></div>`;

async function startFirebaseAuthState(){
  if(!firebaseReady)return;
  fbAuth.onAuthStateChanged(async user=>{
    if(!user)return;
    // Do not auto-enter the dashboard until the role profile is confirmed.
    try{
      const snap=await fbDb.collection("users").doc(user.uid).get();
      if(!snap.exists)return;
      currentUser=user;setRoleFromProfile(snap.data());
      if(role!=="مدير"){await fbAuth.signOut();currentUser=null;currentProfile=null;role=null;return;}
      document.getElementById("store").classList.add("hidden");
      document.getElementById("admin").classList.remove("hidden");
      document.getElementById("roleLabel").textContent=(currentProfile.displayName||user.email)+" · "+role;
      startFirebaseListeners();
      showPage("dashboard",document.querySelector('[data-page="dashboard"]'));
    }catch(e){console.warn("Auth profile",e)}
  });
}
